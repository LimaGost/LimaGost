name: generate contribution invaders

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 03:00 UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate invaders svg (light + dark)
        uses: UltimateStrength/space-invaders-contributions@v1
        with:
          github_user_name: LimaGost
          outputs: |
            dist/invaders.svg
            dist/invaders-dark.svg?palette=github-dark

      - name: publica no branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
